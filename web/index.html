<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<link rel="icon" href="data:," />
<title>ShopMate 售后助手</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e5e7eb;
    --brand: #2563eb;
    --brand-soft: #eff6ff;
    --green: #059669;
    --danger: #b91c1c;
    --danger-soft: #fef2f2;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 820px;
    margin: 0 auto;
  }

  /* ---------------- 顶栏 ---------------- */
  header {
    flex: 0 0 auto;
    padding: 13px 18px 11px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    flex: 0 0 auto;
  }

  .title-block { flex: 1 1 auto; min-width: 0; }

  .title { font-weight: 650; font-size: 15.5px; }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #059669;
    flex: 0 0 auto;
  }

  .dot.off { background: #d1d5db; }

  .icon-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    transition: .15s;
  }

  .icon-btn:hover { border-color: #cbd5e1; color: var(--ink); }
  .icon-btn:active { transform: scale(.97); }

  /* ---------------- 我的订单 ---------------- */
  .orders {
    flex: 0 0 auto;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }

  .orders-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px 9px;
    cursor: pointer;
    user-select: none;
  }

  .orders-title {
    font-size: 13px;
    font-weight: 650;
    flex: 0 0 auto;
  }

  .orders-title em {
    font-style: normal;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .orders-hint {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 11.5px;
    color: var(--faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .orders-toggle {
    flex: 0 0 auto;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: var(--brand);
    cursor: pointer;
  }

  .orders-body {
    padding: 0 18px 11px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 246px;
    overflow-y: auto;
  }

  .orders.collapsed .orders-body { display: none; }

  .order {
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fcfcfd;
    padding: 9px 11px;
    transition: background .35s, border-color .35s;
  }

  /* 状态刚变过：整张卡淡蓝一下，提醒「看这里」 */
  .order.changed {
    background: var(--brand-soft);
    border-color: #bfdbfe;
  }

  .order-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .order-id {
    font-size: 13px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  .order-amount {
    margin-left: auto;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .pill {
    font-size: 11px;
    line-height: 1.6;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .pill.paid, .pill.pending { background: #f1f5f9; color: #475569; }
  .pill.shipped { background: #eff6ff; color: #1d4ed8; }
  .pill.delivered { background: #ecfdf5; color: #047857; }
  .pill.refunding, .pill.after_sales { background: #fff7ed; color: #c2410c; }
  .pill.refunded, .pill.after_sales_done { background: #f5f3ff; color: #6d28d9; }
  .pill.cancelled { background: #f3f4f6; color: #9ca3af; }

  .order-sub {
    margin-top: 3px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 9px;
    font-size: 11.5px;
    color: var(--faint);
  }

  .order-sub b { font-weight: 600; color: var(--muted); }

  .order-actions {
    margin-top: 7px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .mini {
    font: inherit;
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 7px;
    border: 1px solid var(--brand);
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    transition: .15s;
  }

  .mini:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .mini:active { transform: scale(.98); }

  .mini.ghost {
    background: #fff;
    color: #475569;
    border-color: var(--line);
  }

  .mini.ghost:hover { background: #f8fafc; color: var(--ink); border-color: #cbd5e1; }

  .mini[disabled] { opacity: .55; cursor: default; }

  .flash-tag {
    font-size: 11px;
    color: var(--brand);
    margin-left: 2px;
    animation: fade-in .3s ease;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateX(-3px); }
    to { opacity: 1; transform: none; }
  }

  .order-note {
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ---------------- 消息区 ---------------- */
  .messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .row { display: flex; gap: 9px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600;
    margin-top: 2px;
  }

  .avatar.bot { background: var(--brand); color: #fff; }
  .avatar.me { background: #e2e8f0; color: #475569; }

  .stack { max-width: 76%; min-width: 0; }

  .bubble {
    padding: 11px 14px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--line);
    word-break: break-word;
  }

  .row.user .bubble {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble { border-bottom-left-radius: 4px; }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 5px 0 8px; padding-left: 19px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { font-weight: 650; }
  .bubble code {
    background: #f1f5f9;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }

  .bubble.error {
    background: var(--danger-soft);
    border-color: #fecaca;
    color: var(--danger);
  }

  /* ---------------- 每条回答的元信息 ---------------- */
  .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    padding-left: 2px;
    font-size: 11.5px;
    color: var(--faint);
  }

  .meta-btn {
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    color: var(--brand);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .meta-btn:hover { color: #1d4ed8; }
  .meta-btn:disabled { color: var(--faint); cursor: default; text-decoration: none; }

  /* ---------------- 执行轨迹面板 ---------------- */
  .trace {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fcfcfd;
    overflow: hidden;
    font-size: 12.5px;
  }

  .trace-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11.5px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .trace-body { padding: 6px 0; }

  .step {
    display: grid;
    grid-template-columns: 100px 1fr 62px;
    gap: 8px;
    align-items: center;
    padding: 5px 12px;
  }

  .step-name {
    font-size: 12px;
    color: #374151;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .step-name.model { color: #1d4ed8; }
  .step-name.tool { color: #059669; }
  .step-name.bad { color: var(--danger); }

  .bar-wrap {
    height: 6px;
    background: #eef1f5;
    border-radius: 3px;
    overflow: hidden;
    min-width: 20px;
  }

  .bar {
    height: 100%;
    border-radius: 3px;
    background: #93b4f7;
  }

  .bar.model { background: #93b4f7; }
  .bar.tool { background: #6ee7b7; }
  .bar.bad { background: #fca5a5; }

  .step-cost {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    font-size: 11.5px;
  }

  .step-detail {
    grid-column: 2 / 4;
    font-size: 11px;
    color: var(--faint);
    padding-bottom: 3px;
    word-break: break-all;
  }

  /* ---------------- 打字 ---------------- */
  .typing { display: flex; gap: 4px; padding: 3px 1px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #94a3b8;
    animation: blink 1.3s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  /* ---------------- 示例 ---------------- */
  .samples {
    padding: 0 18px 10px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .samples::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    color: #374151;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: .15s;
  }

  .chip:hover {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--brand-soft);
  }

  /* ---------------- 输入 ---------------- */
  .composer {
    flex: 0 0 auto;
    padding: 10px 18px calc(13px + env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--line);
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px 6px 13px;
    transition: .15s;
  }

  .input-wrap:focus-within { border-color: var(--brand); background: #fff; }

  textarea {
    flex: 1 1 auto;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font: inherit;
    color: var(--ink);
    max-height: 140px;
    padding: 6px 0;
    line-height: 1.55;
  }

  textarea::placeholder { color: #9ca3af; }

  .send {
    border: none;
    background: var(--brand);
    color: #fff;
    border-radius: 9px;
    padding: 9px 17px;
    font-size: 14px;
    font-weight: 550;
    cursor: pointer;
    transition: .15s;
    flex: 0 0 auto;
  }

  .send:disabled { background: #bfdbfe; cursor: not-allowed; }
  .send:not(:disabled):active { transform: scale(.97); }

  .footnote {
    margin: 8px 0 0;
    font-size: 11.5px;
    color: var(--faint);
    text-align: center;
  }

  .notice {
    background: var(--brand-soft);
    border: 1px solid #dbeafe;
    color: #1e40af;
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 13px;
    line-height: 1.7;
  }

  .notice b { font-weight: 650; }

  @media (max-width: 520px) {
    .stack { max-width: 84%; }
    header { padding: 12px 14px 10px; }
    .messages { padding: 15px 14px 8px; }
    .samples { padding: 0 14px 8px; }
    .composer { padding-left: 14px; padding-right: 14px; }
    .step { grid-template-columns: 84px 1fr 54px; }
    .orders-head { padding: 8px 14px; }
    .orders-body { padding: 0 14px 9px; }
    .orders-hint { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">SM</div>
    <div class="title-block">
      <div class="title">ShopMate 售后助手</div>
      <div class="subtitle">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">演示数据 · USER001</span>
      </div>
    </div>
    <button class="icon-btn" id="newChatBtn" type="button">新对话</button>
  </header>

  <!-- 我的订单：看得见自己有哪些单、什么状态，点一下就能发起退款 -->
  <section class="orders" id="ordersPanel">
    <div class="orders-head" id="ordersHead">
      <span class="orders-title">我的订单 <em id="ordersCount">—</em></span>
      <span class="orders-hint" id="ordersHint">点「申请退款」，助手会接手剩下的流程</span>
      <button class="orders-toggle" id="ordersToggle" type="button">收起</button>
    </div>
    <div class="orders-body" id="ordersBody"></div>
  </section>

  <main class="messages" id="messages"></main>

  <div class="samples" id="samples">
    <button class="chip" type="button">帮我查 ORD001</button>
    <button class="chip" type="button">ORD001 的物流到哪了</button>
    <button class="chip" type="button">这单能退款吗</button>
    <button class="chip" type="button">退款多久到账</button>
    <button class="chip" type="button">ORD001 商品破损，我要退款</button>
    <button class="chip" type="button">签收超过 7 天还能退吗</button>
  </div>

  <div class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入问题，回车发送，Shift+回车换行"></textarea>
      <button class="send" id="sendBtn" type="button">发送</button>
    </div>
    <p class="footnote">
      模拟数据，不连真实电商系统。点回答下方的「查看执行过程」能看到它调了哪些工具、每步花了多久。
    </p>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // 配置
  //
  // 自己用的版本：身份固定成 USER001，不做访客隔离。
  // 想换成 USER002 演示「查不到别人的订单」，改这一行即可。
  // ============================================================

  var USER_ID = "USER001";
  var CONV_KEY = "shopmate_conversation_id";

  // 后端最慢一次约 9 秒，加上模型故障重试，前端给 100 秒余量。
  var CLIENT_TIMEOUT_MS = 100000;

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var newChatBtn = document.getElementById("newChatBtn");
  var samplesEl = document.getElementById("samples");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");

  var ordersPanel = document.getElementById("ordersPanel");
  var ordersHead = document.getElementById("ordersHead");
  var ordersBody = document.getElementById("ordersBody");
  var ordersToggle = document.getElementById("ordersToggle");
  var ordersCount = document.getElementById("ordersCount");

  var busy = false;

  // 「模拟审核」按钮是否显示，由后端 /demo/status 决定。
  // 本地没开 SHOPMATE_DEMO_REVIEW 时这里是 false，界面上就不会出现
  // 「自己批自己退款」的入口。
  var demoReviewEnabled = false;

  // ============================================================
  // 会话
  // ============================================================

  function getConversationId() {
    return localStorage.getItem(CONV_KEY) || "";
  }

  function setConversationId(id) {
    if (id) { localStorage.setItem(CONV_KEY, id); }
  }

  function clearConversation() {
    localStorage.removeItem(CONV_KEY);
  }

  // ============================================================
  // Markdown 渲染
  //
  // 模型输出是 Markdown。不引外部库：离线可用、加载快。
  // 顺序必须是「先转义 HTML，再做替换」——
  // 反过来的话，用户输入里的 <script> 会被当标签执行。
  // ============================================================

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMarkdown(raw) {
    var text = escapeHtml(raw || "");

    text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");

    var lines = text.split("\n");
    var html = [];
    var inList = false;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var isItem = /^\s*[-*]\s+/.test(line);

      if (isItem) {
        if (!inList) { html.push("<ul>"); inList = true; }
        html.push("<li>" + line.replace(/^\s*[-*]\s+/, "") + "</li>");
      } else {
        if (inList) { html.push("</ul>"); inList = false; }
        if (line.trim() === "") { continue; }
        html.push("<p>" + line + "</p>");
      }
    }

    if (inList) { html.push("</ul>"); }

    return html.join("");
  }

  // ============================================================
  // DOM
  // ============================================================

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(role, innerHtml, extraClass) {
    var row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    var avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "user" ? "me" : "bot");
    avatar.textContent = role === "user" ? "我" : "SM";

    var stack = document.createElement("div");
    stack.className = "stack";

    var bubble = document.createElement("div");
    bubble.className = "bubble" + (extraClass ? " " + extraClass : "");
    bubble.innerHTML = innerHtml;

    stack.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(stack);
    messagesEl.appendChild(row);
    scrollToBottom();

    return stack;
  }

  function addText(role, text, extraClass) {
    return addRow(role, renderMarkdown(text), extraClass);
  }

  function addTyping() {
    var stack = addRow(
      "assistant",
      '<div class="typing"><span></span><span></span><span></span></div>'
    );
    stack.setAttribute("data-typing", "1");
    return stack;
  }

  function removeNode(node) {
    if (node && node.parentNode) { node.parentNode.removeChild(node); }
  }

  /**
   * 移除「正在输入」占位。
   *
   * 注意不能直接 removeNode(stack)：
   * addRow 返回的是内容列 stack，它和头像一起包在 .row 里。
   * 只删 stack 会留下一个孤零零的 SM 头像，
   * 看起来就像助手发了两次消息——这个坑踩过一次。
   */
  function removeTyping(stack) {
    var row = stack && stack.parentNode;
    if (row) { removeNode(row); }
  }

  // ============================================================
  // 执行轨迹
  //
  // 这是自己用版本最有价值的部分：
  // 能看清一次回答里模型调了几次、调了哪些工具、每步多久。
  // 排查「为什么这句话答得怪」时，比只看最终回答有效得多。
  // ============================================================

  var STEP_LABELS = {
    intent_classification: "意图识别",
    ticket_draft: "生成草稿",
    ticket_confirm: "提交工单",
    ticket_cancel: "撤销申请",
    final_answer: "生成回答"
  };

  // 工具名转中文。
  // 原来直接显示 check_refund_eligibility，读起来费劲。
  var TOOL_LABELS = {
    get_order: "查订单",
    get_logistics: "查物流",
    check_refund_eligibility: "查退款资格",
    search_after_sales_policy: "查售后政策",
    draft_after_sales_ticket: "生成申请草稿",
    confirm_after_sales_ticket: "提交申请",
    get_after_sales_tickets: "查工单进度",
    cancel_after_sales_ticket: "撤销申请"
  };

  function toolLabel(name) {
    return TOOL_LABELS[name] || String(name || "").replace(/_/g, " ");
  }

  function stepKind(event) {
    if (event.status && event.status !== "success" && event.status !== "started") {
      return "bad";
    }
    if (event.event === "tool_result" || event.event === "tool_call") { return "tool"; }
    if (event.event === "final_answer" || event.event === "intent_classification") {
      return "model";
    }
    return "misc";
  }

  /**
   * 把原始事件整理成「人能读的步骤」。
   *
   * 为什么要整理而不是直接显示：
   *   原始事件里 tool_call 和 tool_result 是两条，
   *   model_call 和 intent_classification 时间重叠（分类内部就在调模型），
   *   request 是总耗时。
   *   原样显示会看到「查退款资格」出现两次、
   *   「模型 1.1s」和「意图识别 1.1s」并列，读起来像重复计费。
   *
   * 整理规则：
   *   - tool_call 先记下名字，等 tool_result 一起输出（耗时以 result 为准）
   *   - model_call 不单独显示，只统计次数
   *   - request 不显示（总耗时在头部）
   */
  function buildSteps(events) {
    var steps = [];
    var modelCount = 0;
    var lastModelCost = 0;
    var pendingTool = null;

    // 工具内部事件：和随后的 tool_result 说的是同一件事，
    // 成功时跳过，失败时保留（失败原因只有这里能看到）。
    var INTERNAL = {
      ticket_draft: 1,
      ticket_confirm: 1,
      ticket_cancel: 1
    };

    events.forEach(function (e) {
      if (e.event === "request") { return; }

      if (e.event === "model_call") {
        modelCount += 1;
        // 记下最近一次模型调用的耗时：
        // 「生成回答」这个事件本身没有 duration_ms，
        // 它的耗时就是这次模型调用的耗时。
        lastModelCost = Number(e.duration_ms) || lastModelCost;
        return;
      }

      if (e.event === "tool_call") {
        pendingTool = (e.details || {}).tool || "";
        return;
      }

      if (e.event === "tool_result") {
        var tool = (e.details || {}).tool || pendingTool || "工具";
        steps.push({
          label: toolLabel(tool),
          kind: stepKind(e),
          cost: Number(e.duration_ms) || 0,
          detail: (e.status && e.status !== "success") ? ("状态 " + e.status) : ""
        });
        pendingTool = null;
        return;
      }

      // 成功的事件如果只是工具内部的记录，跳过
      if (INTERNAL[e.event] && (!e.status || e.status === "success")) {
        return;
      }

      var d = e.details || {};
      var label = STEP_LABELS[e.event] || e.event;
      var detail = "";

      if (e.event === "intent_classification") {
        // 意图名不拼进标题：标题列只有 100px，
        // 「意图识别 logistics_query」必定被省略号吃掉。
        // 放到下面的说明行，反而看得全。
        if (d.intent) {
          detail = "意图 " + d.intent;
        }
        if (d.confidence !== undefined && d.confidence !== null) {
          var conf = "置信度 " + d.confidence;
          detail = detail ? (detail + " · " + conf) : conf;
        }
      }

      if (d.request_type) {
        detail = detail ? (detail + " · " + d.request_type) : d.request_type;
      }

      if (e.status && e.status !== "success" && e.status !== "started") {
        detail = detail ? (detail + " · " + e.status) : ("状态 " + e.status);
      }

      steps.push({
        label: label,
        kind: stepKind(e),
        cost: e.event === "final_answer"
          ? lastModelCost
          : (Number(e.duration_ms) || 0),
        detail: detail
      });
    });

    // 有 tool_call 但没等到 tool_result（异常中断）：也要显示出来
    if (pendingTool) {
      steps.push({
        label: toolLabel(pendingTool),
        kind: "bad",
        cost: 0,
        detail: "未返回结果"
      });
    }

    return { steps: steps, modelCount: modelCount };
  }

  function formatCost(ms) {
    var v = Number(ms) || 0;
    if (v <= 0) { return "—"; }
    return v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
  }

  function renderTrace(trace) {
    var built = buildSteps(trace.events || []);
    var steps = built.steps;
    var maxCost = 1;

    steps.forEach(function (s) {
      if (s.cost > maxCost) { maxCost = s.cost; }
    });

    var rows = steps.map(function (s) {
      var pct = Math.max(2, Math.round((s.cost / maxCost) * 100));

      return (
        '<div class="step">' +
          '<div class="step-name ' + s.kind + '" title="' + escapeHtml(s.label) + '">' +
            escapeHtml(s.label) +
          '</div>' +
          '<div class="bar-wrap"><div class="bar ' + s.kind + '" style="width:' + pct + '%"></div></div>' +
          '<div class="step-cost">' + formatCost(s.cost) + '</div>' +
          (s.detail ? '<div class="step-detail">' + escapeHtml(s.detail) + '</div>' : '') +
        '</div>'
      );
    }).join("");

    var headMeta = [steps.length + " 步"];

    if (built.modelCount > 0) {
      headMeta.push(built.modelCount + " 次模型调用");
    }

    return (
      '<div class="trace">' +
        '<div class="trace-head">' +
          '<span>执行过程 · ' + headMeta.join(" · ") + '</span>' +
          '<span>合计 ' + formatCost(trace.duration_ms) + '</span>' +
        '</div>' +
        '<div class="trace-body">' + rows + '</div>' +
      '</div>'
    );
  }

  function attachTrace(stack, requestId, elapsedMs) {
    var meta = document.createElement("div");
    meta.className = "meta";

    var info = document.createElement("span");
    info.textContent = formatCost(elapsedMs);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "meta-btn";
    btn.textContent = "查看执行过程";

    var holder = document.createElement("div");

    btn.addEventListener("click", async function () {
      // 已经加载过：在展开 / 收起之间切换，不重复请求
      if (holder.getAttribute("data-loaded") === "1") {
        var opened = holder.getAttribute("data-open") === "1";
        holder.innerHTML = opened ? "" : holder.getAttribute("data-html");
        holder.setAttribute("data-open", opened ? "0" : "1");
        btn.textContent = opened ? "查看执行过程" : "收起";
        return;
      }

      btn.textContent = "加载中…";

      try {
        var res = await fetch("/traces/" + requestId, {
          headers: { "X-User-Id": USER_ID }
        });

        if (!res.ok) {
          btn.textContent = "执行记录已过期";
          btn.disabled = true;
          return;
        }

        var trace = await res.json();
        var html = renderTrace(trace);

        holder.innerHTML = html;
        holder.setAttribute("data-html", html);
        holder.setAttribute("data-loaded", "1");
        holder.setAttribute("data-open", "1");
        btn.textContent = "收起";
        scrollToBottom();

      } catch (err) {
        btn.textContent = "加载失败，点此重试";
      }
    });

    meta.appendChild(info);
    meta.appendChild(btn);
    stack.appendChild(meta);
    stack.appendChild(holder);
  }

  // ============================================================
  // 我的订单
  //
  // 这一块解决「看不见上下文」的问题：
  //   原来只能在对话里问「我有什么订单」，还得自己记住单号。
  //   现在订单和状态一直摆在上面，点一下就能发起退款，
  //   退款受理之后状态会当着你的面变。
  //
  // 状态口径以后端为准：
  //   display_status 是「交易状态 + 售后进度」合出来的，
  //   前端只负责画，不自己拼状态，避免两边说法不一致。
  // ============================================================

  // 上一次各订单的展示状态，用来判断「这次是不是变了」。
  var orderStatusCache = {};

  function formatOrderDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return ""; }

    var mm = String(d.getMonth() + 1);
    var dd = String(d.getDate());

    if (mm.length < 2) { mm = "0" + mm; }
    if (dd.length < 2) { dd = "0" + dd; }

    return mm + "-" + dd;
  }

  function orderCardHtml(order) {
    var ticket = order.ticket;
    var status = order.display_status;

    // 已经进入售后流程的状态：这时候不能再「申请退款」，
    // 也不该再解释「为什么不能退」——用户已经在流程里了。
    var inAfterSales = status === "refunding" ||
      status === "refunded" ||
      status === "after_sales" ||
      status === "after_sales_done";

    var canRefund = order.can_request_refund && !inAfterSales;

    var pending = ticket && ticket.status === "pending";

    var sub = [
      "<span>" + escapeHtml(formatOrderDate(order.order_time)) + " 下单</span>"
    ];

    if (ticket) {
      sub.push(
        "<span>工单 <b>" + escapeHtml(ticket.short_id) + "</b> · " +
        escapeHtml(ticket.status_label) + "</span>"
      );
    }

    if (ticket && ticket.review_note) {
      sub.push("<span>审核意见：" + escapeHtml(ticket.review_note) + "</span>");
    }

    var actions = "";

    if (canRefund) {
      actions += '<button class="mini" type="button" data-act="refund">申请退款</button>';
    }

    // 待审核的单可以直接让助手撤销，不用再去对话里说一遍单号。
    if (status === "refunding" && ticket && ticket.status === "pending") {
      actions += '<button class="mini ghost" type="button" data-act="cancel">撤销申请</button>';
    }

    // 模拟审核只在本地开了开关时出现，且只对「待审核」的单有效。
    if (pending && demoReviewEnabled) {
      actions += '<button class="mini ghost" type="button" data-act="approve">模拟通过</button>';
      actions += '<button class="mini ghost" type="button" data-act="reject">模拟驳回</button>';
    }

    // 说明文字要跟当前状态说同一件事。
    // 这里踩过两次：已退款的单还在显示「可以申请退款」；
    // 退款中的单已经有个「撤销申请」按钮了，再说一句「可以撤销」是废话。
    var note = "";

    if (status === "refunded") {
      note = "退款已完成。";
    } else if (status === "after_sales_done") {
      note = "售后已完成。";
    } else if (status === "after_sales") {
      note = "售后处理中。";
    } else if (status === "refunding") {
      note = "";
    } else if (!canRefund) {
      note = order.refund_hint || "";
    }

    if (note) {
      actions += '<span class="order-note">' + escapeHtml(note) + "</span>";
    }

    if (!actions) {
      actions = '<span class="order-note">暂无可用操作</span>';
    }

    return (
      '<div class="order" data-order="' + escapeHtml(order.order_id) + '"' +
        (ticket ? ' data-ticket="' + escapeHtml(ticket.ticket_id) + '"' : "") + ">" +
        '<div class="order-top">' +
          '<span class="order-id">' + escapeHtml(order.order_id) + "</span>" +
          '<span class="pill ' + escapeHtml(status) + '">' +
            escapeHtml(order.display_status_label) +
          "</span>" +
          '<span class="order-amount">¥' + escapeHtml(order.total_amount) + "</span>" +
        "</div>" +
        '<div class="order-sub">' + sub.join("") + "</div>" +
        '<div class="order-actions">' + actions + "</div>" +
      "</div>"
    );
  }

  function renderOrders(list) {
    var changed = [];

    list.forEach(function (order) {
      var previous = orderStatusCache[order.order_id];

      if (previous && previous !== order.display_status) {
        changed.push(order.order_id);
      }

      orderStatusCache[order.order_id] = order.display_status;
    });

    ordersCount.textContent = list.length ? String(list.length) : "0";

    if (!list.length) {
      ordersBody.innerHTML = '<div class="order-note">名下暂时没有订单。</div>';
      return;
    }

    ordersBody.innerHTML = list.map(orderCardHtml).join("");

    // 状态变过的那张卡高亮两秒半，不然用户根本注意不到「待发货」变成了「退款中」。
    changed.forEach(function (orderId) {
      var card = ordersBody.querySelector('[data-order="' + orderId + '"]');
      if (!card) { return; }

      card.classList.add("changed");

      var top = card.querySelector(".order-top");
      if (top) {
        var tag = document.createElement("span");
        tag.className = "flash-tag";
        tag.textContent = "状态已更新";
        top.appendChild(tag);

        setTimeout(function () {
          if (tag.parentNode) { tag.parentNode.removeChild(tag); }
        }, 2600);
      }

      setTimeout(function () { card.classList.remove("changed"); }, 2600);
    });
  }

  async function refreshOrders() {
    try {
      var res = await fetch("/orders", {
        headers: { "X-User-Id": USER_ID }
      });

      if (!res.ok) { return; }

      renderOrders(await res.json());

    } catch (err) {
      // 订单面板拉不到不该影响聊天，静默失败即可。
    }
  }

  async function loadDemoStatus() {
    try {
      var res = await fetch("/demo/status");
      if (!res.ok) { return; }

      var data = await res.json();
      demoReviewEnabled = !!(data && data.review_enabled);

    } catch (err) {
      demoReviewEnabled = false;
    }
  }

  async function reviewTicket(ticketId, decision) {
    var label = decision === "approved" ? "通过" : "驳回";

    try {
      var res = await fetch("/demo/review/" + ticketId, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-User-Id": USER_ID
        },
        body: JSON.stringify({
          decision: decision,
          review_note: decision === "rejected" ? "演示：材料不足，请补充凭证" : null
        })
      });

      if (!res.ok) {
        var detail = "HTTP " + res.status;
        try {
          var body = await res.json();
          if (body && body.detail) { detail = body.detail; }
        } catch (e) { /* 非 JSON，用状态码 */ }

        addText("assistant", "模拟审核" + label + "失败：" + detail, "error");
        return;
      }

      await refreshOrders();

    } catch (err) {
      addText("assistant", "连不上服务，审核没有提交成功。", "error");
    }
  }

  ordersBody.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    if (!btn) { return; }

    var card = btn.closest(".order");
    if (!card) { return; }

    var orderId = card.getAttribute("data-order");
    var ticketId = card.getAttribute("data-ticket");
    var act = btn.getAttribute("data-act");

    if (act === "refund") {
      // 不在前端自己拼工单：把话交给助手，走它那套
      // 「查资格 → 生成草稿 → 等确认」的流程，
      // 界面上看到的状态变化才算真的发生过。
      send("我想退 " + orderId);
      return;
    }

    if (act === "approve" && ticketId) {
      reviewTicket(ticketId, "approved");
      return;
    }

    if (act === "cancel") {
      // 撤销同样交给助手走工具，前端不直接调工单接口：
      // 走一遍对话，执行过程里能看到「撤销申请」这一步。
      send("撤销 " + orderId + " 的退款申请");
      return;
    }

    if (act === "reject" && ticketId) {
      reviewTicket(ticketId, "rejected");
    }
  });

  function toggleOrders() {
    var collapsed = ordersPanel.classList.toggle("collapsed");
    ordersToggle.textContent = collapsed ? "展开" : "收起";
  }

  ordersHead.addEventListener("click", toggleOrders);

  // ============================================================
  // 状态
  // ============================================================

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    inputEl.disabled = value;
    sendBtn.textContent = value ? "等待中" : "发送";
  }

  function markOffline() {
    statusDot.classList.add("off");
    statusText.textContent = "服务未连接";
  }

  function markOnline() {
    statusDot.classList.remove("off");
    statusText.textContent = "演示数据 · " + USER_ID;
  }

  // ============================================================
  // 发送
  // ============================================================

  async function send(message) {
    if (busy) { return; }

    var text = (message || "").trim();
    if (!text) { return; }

    addText("user", text);
    inputEl.value = "";
    autoGrow();
    setBusy(true);

    if (samplesEl) { samplesEl.style.display = "none"; }

    var typing = addTyping();

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, CLIENT_TIMEOUT_MS);
    var startedAt = performance.now();

    try {
      var res = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-User-Id": USER_ID
        },
        body: JSON.stringify({
          message: text,
          conversation_id: getConversationId() || null
        }),
        signal: controller.signal
      });

      clearTimeout(timer);
      removeTyping(typing);

      if (!res.ok) {
        await handleHttpError(res);
        return;
      }

      var data = await res.json();
      var elapsed = performance.now() - startedAt;

      setConversationId(data.conversation_id);
      markOnline();

      var stack = addText("assistant", data.answer || "（没有返回内容）");
      attachTrace(stack, data.request_id, elapsed);

      // 每轮问答之后刷一次订单：助手可能刚建了工单 / 撤了单，
      // 上面的订单卡要跟着变，不然状态是死的。
      refreshOrders();

    } catch (err) {
      clearTimeout(timer);
      removeTyping(typing);

      if (err && err.name === "AbortError") {
        addText(
          "assistant",
          "这次等太久了，服务可能正忙。可以再发一次，或者点「新对话」重来。",
          "error"
        );
      } else {
        addText(
          "assistant",
          "连不上服务。确认 `start_demo.bat` 那个窗口还在运行，然后刷新页面。",
          "error"
        );
        markOffline();
      }
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  async function handleHttpError(res) {
    var detail = "";

    try {
      var body = await res.json();
      detail = (body && body.detail) || "";
    } catch (e) { /* 非 JSON，忽略 */ }

    var text;

    if (res.status === 429) {
      text = "发得太快了，等十几秒再试。";
    } else if (res.status === 503 || res.status === 504) {
      text = detail || "服务暂时不可用，稍后再试。";
    } else if (res.status === 404) {
      text = "这个对话已失效，点右上角「新对话」重新开始。";
    } else if (res.status >= 500) {
      text = "服务出了点问题，稍后再试。";
    } else {
      text = detail || ("请求没成功（" + res.status + "）");
    }

    addText("assistant", text, "error");
  }

  // ============================================================
  // 输入
  // ============================================================

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  inputEl.addEventListener("input", autoGrow);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(inputEl.value);
    }
  });

  sendBtn.addEventListener("click", function () { send(inputEl.value); });

  newChatBtn.addEventListener("click", function () {
    if (busy) { return; }
    clearConversation();
    messagesEl.innerHTML = "";
    if (samplesEl) { samplesEl.style.display = ""; }
    boot();
  });

  samplesEl.addEventListener("click", function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains("chip")) {
      send(t.textContent);
    }
  });

  // ============================================================
  // 首屏
  // ============================================================

  function boot() {
    var notice = document.createElement("div");
    notice.className = "notice";
    notice.innerHTML =
      "当前身份 <b>" + USER_ID + "</b>，能查 <b>ORD001</b>、<b>ORD002</b>；" +
      "<b>ORD003</b> 属于别人，查它会被拒绝（越权保护，可以试一下）。<br>" +
      "每条回答下面有「查看执行过程」，能看到模型调用、工具调用和每步耗时。";
    messagesEl.appendChild(notice);

    addText("assistant", "你好，我是售后助手。想先查 **ORD001**，还是直接说遇到的问题？");

    fetch("/health")
      .then(function (r) { r.ok ? markOnline() : markOffline(); })
      .catch(markOffline);

    // 先问一下「模拟审核」开没开，再拉订单：
    // 反过来的话订单卡会先画出来、按钮再过一下才补上。
    loadDemoStatus().then(refreshOrders);

    inputEl.focus();
  }

  boot();

})();
</script>
</body>
</html>
